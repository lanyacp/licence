<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>培训结业证书下载</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 验证表单 -->
  <div class="student-container" id="verifySection">
    <div class="student-card">
      <div class="logo">
        <div class="logo-icon">&#127891;</div>
      </div>
      <h1>培训结业证书下载</h1>
      <p class="subtitle">请输入您的个人信息进行验证</p>
      <form id="verifyForm">
        <div class="form-group">
          <label>姓名</label>
          <input type="text" id="name" placeholder="请输入您的姓名" autocomplete="off" required>
        </div>
        <div class="form-group">
          <label>身份证号</label>
          <input type="text" id="idNumber" placeholder="请输入您的身份证号" autocomplete="off" required>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">查询并生成证书</button>
      </form>
      <div class="message" id="message"></div>
    </div>
  </div>

  <!-- 证书结果 -->
  <div class="result-container" id="resultSection" style="display:none;">
    <div class="result-card">
      <h2>您的结业证书已生成</h2>
      <p class="hint">请确认信息无误后下载，证书保存为高清图片</p>
      <div class="certificate-preview">
        <canvas id="certificateCanvas"></canvas>
      </div>
      <div class="actions">
        <button class="btn-download" id="downloadBtn">&#11015; 下载证书</button>
        <button class="btn-secondary" id="backBtn">重新查询</button>
      </div>
    </div>
  </div>

  <script src="js/certificate.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
